[package]
name = "clocx"
description = "Count lines of code and watch where work is happening, across git worktrees"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "clocx"
path = "src/main.rs"

[dependencies]
anstream = "1"
anstyle = "1"
clap = { version = "4.6", features = ["derive", "env"] }
dirs = "7.0.0"
gix = { version = "0.88", default-features = false, features = ["revision", "blob-diff", "max-performance-safe", "index", "status", "dirwalk", "excludes", "attributes", "sha1"] }
ignore = "0.4.33"
jiff = { version = "0.2", features = ["serde"] }
rayon = "1.12.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2"
tokei = { version = "15", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
unicode-width = "0.2"
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
