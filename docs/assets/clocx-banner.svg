<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="clocx: count lines of code and see where work is happening, across every git worktree.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f16"/>
      <stop offset="1" stop-color="#101724"/>
    </linearGradient>
    <radialGradient id="glowAdd" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3fb950" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#3fb950" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowSpark" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f0f6fc"/>
      <stop offset="1" stop-color="#a5b8cc"/>
    </linearGradient>
    <linearGradient id="addFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#56d364"/>
      <stop offset="1" stop-color="#2ea043"/>
    </linearGradient>
    <linearGradient id="delFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff7b72"/>
      <stop offset="1" stop-color="#da3633"/>
    </linearGradient>
    <linearGradient id="sparkFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#79c0ff"/>
      <stop offset="1" stop-color="#388bfd"/>
    </linearGradient>
    <linearGradient id="markBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161b22"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <circle cx="160" cy="160" r="170" fill="url(#glowAdd)"/>
  <circle cx="1010" cy="170" r="210" fill="url(#glowSpark)"/>

  <!-- Mark: a terminal tile with rising code bars (green) over a removal bar (red). -->
  <g transform="translate(70 70)">
    <rect width="180" height="180" rx="40" fill="url(#markBg)" stroke="#30363d" stroke-width="2"/>
    <circle cx="30" cy="28" r="6" fill="#ff7b72"/>
    <circle cx="50" cy="28" r="6" fill="#d29922"/>
    <circle cx="70" cy="28" r="6" fill="#3fb950"/>
    <rect x="30" y="112" width="20" height="38" rx="4" fill="url(#addFill)"/>
    <rect x="58" y="92" width="20" height="58" rx="4" fill="url(#addFill)"/>
    <rect x="86" y="70" width="20" height="80" rx="4" fill="url(#addFill)"/>
    <rect x="114" y="52" width="20" height="98" rx="4" fill="url(#addFill)"/>
    <rect x="142" y="128" width="12" height="22" rx="3" fill="url(#delFill)"/>
    <rect x="30" y="156" width="124" height="3" rx="1.5" fill="#30363d"/>
  </g>

  <!-- Wordmark and tagline. -->
  <text x="290" y="168" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="104" font-weight="700" fill="url(#wordmark)" letter-spacing="-2">clocx</text>
  <text x="294" y="214" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" fill="#8b949e">count lines of code. see where work is happening.</text>
  <text x="294" y="250" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#6e7681">totals, git activity and every worktree; one report or a live view</text>

  <!-- Report motif: a window with activity rows, churn and sparklines. -->
  <g transform="translate(860 64)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15">
    <rect width="290" height="192" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
    <text x="18" y="32" fill="#39c5cf" font-weight="700">Activity</text>
    <rect x="18" y="42" width="254" height="1" fill="#30363d"/>

    <text x="18" y="70" fill="#c9d1d9">1h</text>
    <text x="56" y="70" fill="#3fb950">+412</text>
    <text x="114" y="70" fill="#f85149">-38</text>
    <g fill="url(#sparkFill)">
      <rect x="170" y="62" width="7" height="8" rx="1"/><rect x="180" y="58" width="7" height="12" rx="1"/>
      <rect x="190" y="64" width="7" height="6" rx="1"/><rect x="200" y="54" width="7" height="16" rx="1"/>
      <rect x="210" y="60" width="7" height="10" rx="1"/><rect x="220" y="52" width="7" height="18" rx="1"/>
      <rect x="230" y="57" width="7" height="13" rx="1"/><rect x="240" y="50" width="7" height="20" rx="1"/>
      <rect x="250" y="55" width="7" height="15" rx="1"/><rect x="260" y="49" width="7" height="21" rx="1"/>
      <rect x="260" y="53" width="7" height="17" rx="1"/>
    </g>

    <text x="18" y="104" fill="#c9d1d9">24h</text>
    <text x="56" y="104" fill="#3fb950">+3.1k</text>
    <text x="114" y="104" fill="#f85149">-604</text>
    <g fill="url(#sparkFill)">
      <rect x="170" y="100" width="7" height="4" rx="1"/><rect x="180" y="98" width="7" height="6" rx="1"/>
      <rect x="190" y="101" width="7" height="3" rx="1"/><rect x="200" y="99" width="7" height="5" rx="1"/>
      <rect x="210" y="96" width="7" height="8" rx="1"/><rect x="220" y="92" width="7" height="12" rx="1"/>
      <rect x="230" y="94" width="7" height="10" rx="1"/><rect x="240" y="89" width="7" height="15" rx="1"/>
      <rect x="250" y="91" width="7" height="13" rx="1"/><rect x="260" y="86" width="7" height="18" rx="1"/>
      <rect x="260" y="84" width="7" height="20" rx="1"/>
    </g>

    <rect x="18" y="122" width="254" height="1" fill="#30363d"/>
    <text x="18" y="150" fill="#39c5cf">*</text><text x="34" y="150" fill="#c9d1d9">agent-2</text>
    <text x="124" y="150" fill="#3fb950">+87</text>
    <text x="164" y="150" fill="#f85149">-12</text>
    <text x="206" y="150" fill="#6e7681">2m ago</text>
    <text x="34" y="176" fill="#c9d1d9">agent-7</text>
    <text x="124" y="176" fill="#3fb950">+240</text>
    <text x="172" y="176" fill="#f85149">-9</text>
    <text x="206" y="176" fill="#6e7681">9m ago</text>
  </g>
</svg>
