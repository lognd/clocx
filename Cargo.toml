[workspace]
resolver = "3"
members = ["crates/clocx"]

[workspace.package]
version = "0.2.1"
edition = "2024"
rust-version = "1.88"
license = "GPL-2.0-only"
authors = ["Logan Dapp <logan@logand.app>"]
repository = "https://github.com/lognd/clocx"
homepage = "https://github.com/lognd/clocx"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
# All output goes through the renderer module; it alone opts back in.
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"
